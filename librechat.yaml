# LibreChat configuration for Dirk — served via CONFIG_PATH from GitHub.
# Edit this file in the justdirk/ai repo; changes apply on the next restart/redeploy.
version: 1.2.1
cache: true

# Per-user token credits: hard stop when spent, refills weekly.
# 1,000,000 credits ~= $1 of token spend. Students get ~$2/week.
balance:
  enabled: true
  startBalance: 2000000
  autoRefillEnabled: true
  refillIntervalValue: 7
  refillIntervalUnit: "days"
  refillAmount: 2000000

interface:
  customWelcome: "Ask anything — your prompt gets auto-improved, then answered."
  # Students get one simple experience (Prompt Coach). No model picker, no agent
  # builder/marketplace. Re-enable these here if you need them for admin work.
  modelSelect: false
  parameters: false
  presets: false
  prompts: false
  bookmarks: false
  multiConvo: false
  agents: false
  endpointsMenu: false

# Curated model choices. "Prompt Coach" is the default: it rewrites the user's
# message into a well-structured prompt (cheap model), shows it, then answers
# with a frontier model.
modelSpecs:
  prioritize: true
  enforce: false
  list:
    - name: "coach"
      label: "Prompt Coach (improves your prompt, then answers)"
      default: true
      description: "Rewrites your message into a great prompt, shows it, then a frontier model answers"
      preset:
        endpoint: "Prompt Coach"
        model: "prompt-coach"
    - name: "auto"
      label: "Auto (picks the best model)"
      description: "Analyzes your prompt and routes it to the most suitable model"
      preset:
        endpoint: "OpenRouter"
        model: "openrouter/auto"
    - name: "main"
      label: "Main AI (Kimi K2)"
      description: "Frontier open model — best for most questions"
      preset:
        endpoint: "OpenRouter"
        model: "moonshotai/kimi-k2"
    - name: "reasoner"
      label: "Deep Reasoner (DeepSeek)"
      description: "Slower, shows step-by-step thinking — math, analysis"
      preset:
        endpoint: "OpenRouter"
        model: "deepseek/deepseek-chat"
    - name: "fast"
      label: "Quick (Qwen3 14B)"
      description: "Fast and cheap for simple questions"
      preset:
        endpoint: "OpenRouter"
        model: "qwen/qwen3-14b"

endpoints:
  custom:
    # ---- Prompt Coach middleware: optimize (cheap) -> show -> solve (frontier) ----
    - name: "Prompt Coach"
      apiKey: "${PROMPTCOACH_AUTH}"
      baseURL: "https://promptcoach-production.up.railway.app/v1"
      models:
        default: ["prompt-coach"]
        fetch: false
      titleConvo: true
      titleModel: "prompt-coach"
      modelDisplayLabel: "Prompt Coach"

    # ---- OpenRouter: the admin's key (set OPENROUTER_KEY in Railway variables) ----
    - name: "OpenRouter"
      apiKey: "${OPENROUTER_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      models:
        default:
          [
            "openrouter/auto",
            "moonshotai/kimi-k2",
            "deepseek/deepseek-chat",
            "qwen/qwen3-14b",
            "z-ai/glm-4.5",
          ]
        fetch: false
      titleConvo: true
      titleModel: "qwen/qwen3-14b"
      modelDisplayLabel: "OpenRouter"

# ---- MCP servers: the models' hands ----
mcpServers:
  # SCRIBE recorder — reaches the local browser on the Mac via the outbound broker.
  scribe-recorder:
    type: streamable-http
    url: "${SCRIBE_BROKER_URL}"
    headers:
      Authorization: "Bearer ${SCRIBE_MCP_TOKEN}"
    timeout: 120000
