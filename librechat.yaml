# LibreChat configuration for Dirk — served via CONFIG_PATH from GitHub.
# Edit this file in the justdirk/ai repo; changes apply on the next restart/redeploy.
version: 1.2.1
cache: true

interface:
  customWelcome: "Ask anything. The right open model is picked for you."
  # Simplified UI: users see a curated model picker and nothing else.
  modelSelect: true
  parameters: false      # hide temperature/top-p etc.
  presets: false
  prompts: false
  bookmarks: false
  multiConvo: false
  agents: true           # keep agent builder (admin use)
  endpointsMenu: false   # hide raw endpoint switcher

# Curated, human-named model choices shown to users instead of a 300-model list.
modelSpecs:
  prioritize: true
  enforce: false
  list:
    - name: "auto"
      label: "Auto (picks the best model)"
      default: true
      description: "Analyzes your prompt and routes it to the most suitable model"
      preset:
        endpoint: "OpenRouter"
        model: "openrouter/auto"
    - name: "main"
      label: "Main AI (Kimi K2)"
      description: "Frontier open model — best for most questions"
      preset:
        endpoint: "OpenRouter"
        model: "moonshotai/kimi-k2"
    - name: "reasoner"
      label: "Deep Reasoner (DeepSeek)"
      description: "Slower, shows step-by-step thinking — math, analysis"
      preset:
        endpoint: "OpenRouter"
        model: "deepseek/deepseek-chat"
    - name: "fast"
      label: "Quick (Qwen3 14B)"
      description: "Fast and cheap for simple questions"
      preset:
        endpoint: "OpenRouter"
        model: "qwen/qwen3-14b"

endpoints:
  custom:
    # ---- OpenRouter: the admin's key (set OPENROUTER_KEY in Railway variables) ----
    # Users never handle keys; the admin pays and controls access.
    - name: "OpenRouter"
      apiKey: "${OPENROUTER_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      models:
        default:
          [
            "openrouter/auto",
            "moonshotai/kimi-k2",
            "deepseek/deepseek-chat",
            "qwen/qwen3-14b",
            "z-ai/glm-4.5",
          ]
        fetch: false     # curated list only — no 300-model soup
      titleConvo: true
      titleModel: "qwen/qwen3-14b"
      modelDisplayLabel: "OpenRouter"

    # ---- Your own server (uncomment when your RunPod/Ollama endpoint exists) ----
    # - name: "My GPU"
    #   apiKey: "none"
    #   baseURL: "${MY_GPU_BASE_URL}"
    #   models:
    #     default: ["qwen3:14b"]
    #     fetch: true
    #   modelDisplayLabel: "Self-hosted"

